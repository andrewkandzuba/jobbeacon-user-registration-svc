name: JAVA.CI.MAVEN

on:
    push:
        branches:
        - main
        - feature/*
    pull_request:
        branches:
        - main
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4
        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            distribution: 'tenurim'
            java-version: '11'
            cache: 'maven'
            cache-dependency-path: 'pom.xml'
        - name: Build with Maven
          run: mvn -B package --file pom.xml
